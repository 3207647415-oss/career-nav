<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>职路导航</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: "#2563eb",
            mint: "#14b8a6",
            soft: "#eef6ff"
          }
        }
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <header class="fixed inset-x-0 top-0 z-50 border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <button class="text-lg font-bold text-brand" data-nav="home">职路导航</button>
      <button id="mobile-menu-btn" class="rounded-lg border border-slate-200 px-3 py-2 text-sm md:hidden">菜单</button>
      <div id="nav-links" class="hidden gap-2 md:flex">
        <button class="nav-btn" data-nav="home">首页</button>
        <button class="nav-btn" data-nav="industry">行业认知</button>
        <button class="nav-btn" data-nav="quiz">职业测评</button>
        <button class="nav-btn" data-nav="kaoyan">考研专区</button>
        <button class="nav-btn" data-nav="job">就业专区</button>
        <button class="nav-btn" data-nav="gong">考公专区</button>
      </div>
    </nav>
    <div id="mobile-menu" class="hidden border-t border-slate-100 bg-white px-4 pb-3 md:hidden">
      <div class="grid grid-cols-2 gap-2">
        <button class="nav-btn" data-nav="home">首页</button>
        <button class="nav-btn" data-nav="industry">行业认知</button>
        <button class="nav-btn" data-nav="quiz">职业测评</button>
        <button class="nav-btn" data-nav="kaoyan">考研专区</button>
        <button class="nav-btn" data-nav="job">就业专区</button>
        <button class="nav-btn" data-nav="gong">考公专区</button>
      </div>
    </div>
  </header>

  <main class="pt-16">
    <section id="page-home" class="page">
      <div class="mx-auto max-w-7xl px-4 py-14 md:py-20">
        <div class="grid gap-10 md:grid-cols-[1.15fr_0.85fr] md:items-center">
          <div>
            <p class="mb-4 inline-flex rounded-full bg-blue-50 px-4 py-2 text-sm font-semibold text-brand">先选路，再铺路</p>
            <h1 class="max-w-4xl text-4xl font-black leading-tight tracking-tight text-slate-950 md:text-6xl">职路导航：帮你从学生到社会，找对自己的路</h1>
            <p class="mt-6 max-w-2xl text-lg leading-8 text-slate-600">迷茫？先看行业了解社会；有规划？一站式拿齐所有备考求职资源</p>
            <div class="mt-8 flex flex-col gap-3 sm:flex-row">
              <button class="rounded-xl bg-brand px-6 py-3 font-semibold text-white shadow-lg shadow-blue-200 transition hover:bg-blue-700" data-nav="quiz">先做测评找方向</button>
              <button class="rounded-xl border border-slate-300 bg-white px-6 py-3 font-semibold text-slate-700 transition hover:border-brand hover:text-brand" data-nav="industry">先看行业了解社会</button>
            </div>
          </div>
          <div class="rounded-3xl border border-blue-100 bg-white p-6 shadow-xl shadow-blue-100/60">
            <div class="grid gap-4">
              <div class="rounded-2xl bg-soft p-5">
                <p class="text-sm font-semibold text-brand">我们的优势</p>
                <p class="mt-2 text-2xl font-bold text-slate-950">一站式搞定升学就业信息</p>
                <p class="mt-3 text-slate-600">不用跨 5 个平台凑信息：行业、考研、就业、考公、测评结果都在一个页面里串起来。</p>
              </div>
              <div class="grid grid-cols-3 gap-3 text-center text-sm">
                <div class="rounded-2xl bg-slate-50 p-4"><b class="block text-2xl text-brand">10</b>热门行业</div>
                <div class="rounded-2xl bg-slate-50 p-4"><b class="block text-2xl text-brand">25</b>测评题</div>
                <div class="rounded-2xl bg-slate-50 p-4"><b class="block text-2xl text-brand">4</b>方向推荐</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="page-industry" class="page hidden">
      <div class="page-shell">
        <div class="page-head">
          <div>
            <p class="eyebrow">行业认知</p>
            <h2 class="page-title">先了解社会，再决定路线</h2>
          </div>
          <input id="industry-search" class="search-input" placeholder="搜索行业，如互联网、金融、公务员" />
        </div>
        <div id="industry-list" class="card-grid"></div>
      </div>
    </section>

    <section id="page-quiz" class="page hidden">
      <div class="mx-auto max-w-3xl px-4 py-8">
        <div id="quiz-card" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm md:p-7"></div>
      </div>
    </section>

    <section id="page-kaoyan" class="page hidden">
      <div class="page-shell">
        <div class="page-head">
          <div>
            <p class="eyebrow">考研专区</p>
            <h2 class="page-title">院校、导师、竞赛、资料一次看齐</h2>
          </div>
          <input id="kaoyan-search" class="search-input" placeholder="输入专业，如计算机、金融" />
        </div>
        <div id="kaoyan-content"></div>
      </div>
    </section>

    <section id="page-job" class="page hidden">
      <div class="page-shell">
        <div class="page-head">
          <div>
            <p class="eyebrow">就业专区</p>
            <h2 class="page-title">岗位匹配、成长路线和投递渠道</h2>
          </div>
          <input id="job-search" class="search-input" placeholder="输入专业，如教育学、金融" />
        </div>
        <div id="job-content"></div>
      </div>
    </section>

    <section id="page-gong" class="page hidden">
      <div class="page-shell">
        <div class="page-head">
          <div>
            <p class="eyebrow">考公专区</p>
            <h2 class="page-title">岗位、考试类型、公告与资料</h2>
          </div>
          <input id="gong-search" class="search-input" placeholder="输入专业，如汉语言文学、计算机" />
        </div>
        <div id="gong-content"></div>
      </div>
    </section>
  </main>

  <template id="pill-template"><span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-brand"></span></template>

  <style type="text/tailwindcss">
    @layer components {
      .nav-btn { @apply rounded-lg px-3 py-2 text-sm font-semibold text-slate-600 transition hover:bg-blue-50 hover:text-brand; }
      .nav-btn.active { @apply bg-blue-50 text-brand; }
      .page-shell { @apply mx-auto max-w-7xl px-4 py-8; }
      .page-head { @apply mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between; }
      .eyebrow { @apply mb-2 text-sm font-bold text-brand; }
      .page-title { @apply text-2xl font-black text-slate-950 md:text-4xl; }
      .search-input { @apply w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none transition focus:border-brand focus:ring-4 focus:ring-blue-100 md:max-w-sm; }
      .card-grid { @apply grid gap-4 md:grid-cols-2 xl:grid-cols-3; }
      .data-card { @apply rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg; }
      .section-title { @apply mb-4 text-xl font-black text-slate-950; }
      .link-btn { @apply inline-flex rounded-lg bg-blue-50 px-3 py-2 text-sm font-semibold text-brand transition hover:bg-blue-100; }
      .field { @apply rounded-xl border border-slate-200 px-3 py-2 outline-none focus:border-brand focus:ring-4 focus:ring-blue-100; }
    }
  </style>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
